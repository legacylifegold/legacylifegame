[profile.default]
src = "contracts"
test = "test"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
auto_detect_solc = true
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "pancake-swap-core/=lib/pancake-swap-core/contracts/",
]

[lint]
# LLGAME, WBNB and Pancake LP transfers revert on failure.
exclude_lints = ["erc20-unchecked-transfer"]
