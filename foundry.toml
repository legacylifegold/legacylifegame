[profile.default]
src = "contracts"
test = "test"
libs = ["dependencies"]
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
auto_detect_solc = true
remappings = [
    "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.6.1/contracts/",
    "forge-std/=dependencies/forge-std-1.9.4/src/",
]

# Libraries are installed at build time by Soldeer (`forge soldeer install`) from their publishers' release
# archives, each held to the checksum of soldeer.lock; the remappings above are written by hand and name the
# pinned versions.
[dependencies]
"@openzeppelin-contracts" = { version = "5.6.1", url = "https://github.com/OpenZeppelin/openzeppelin-contracts/archive/refs/tags/v5.6.1.zip" }
forge-std = { version = "1.9.4", url = "https://github.com/foundry-rs/forge-std/archive/refs/tags/v1.9.4.zip" }

[soldeer]
remappings_generate = false
recursive_deps = false

[lint]
# LLGAME, WBNB and Pancake LP transfers revert on failure.
exclude_lints = ["erc20-unchecked-transfer"]
